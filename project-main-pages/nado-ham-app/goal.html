    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>nado-ham</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/header_nav_footer.css">
    <link rel="stylesheet" href="css/goal.css">

    <script src="js/goal.js" defer></script>
    <script src="js/goal_today.js" defer></script>
    <script src="js/goal_retro.js" defer></script>

</head>
<body>

<header>
    <div id="top">
        <h3>nado-ham</h3>
        <!-- 좁은 화면(모바일)에서만 보이는 메뉴 버튼 -->
        <button type="button" id="menu_toggle" aria-controls="header_wrap nav_wrap" aria-expanded="false">MENU</button>
    </div>
    <div id="header_wrap">
        <a href="">home</a>

        <!--
        <span th:if="${session.loginedID == null}">
                <a th:href="@{/member/signup}">sign-up</a> &nbsp;&nbsp;
                <a th:href="@{/member/signin}">sign-in</a> &nbsp;&nbsp;
        </span>

        <span th:if="${session.loginedID != null}">
                 <a th:href="@{/member/modify}">modify</a> &nbsp;&nbsp;
                <a th:href="@{/member/signout_confirm}">signout</a> &nbsp;&nbsp;
        </span>
        -->

        

        
            <a href="member/modify">modify</a>
            <!-- CSRF 보호 때문에 로그아웃은 POST 로만 받는다. 링크를 누르면 아래 숨은 폼을 보낸다(csrf.js) -->
            <a href="#none" class="signout_link">signout</a>
            <form id="signout_form" action="/member/signout_confirm" method="post" hidden><input type="hidden" name="_csrf" value="SaTCIBqTqwU_zi-eBRhIhoVCQkvEFmocBI6FgrfC9fcFPqkQeJHxFy2mmGcS_xmvZzV8tbFzbyr8IlgxNejm54DyxcJjDJEl"/></form>
        

    </div>
    <!-- fetch 요청에 붙일 CSRF 토큰(csrf.js 가 읽는다) -->
    <div id="csrf_token" hidden data-token="REDACTED" data-header="X-CSRF-TOKEN"></div>

</header>

<nav>
    <div id="nav_wrap">
        <a href="planner">planner</a>
        <a href="goal">goal</a>
        
        
    </div>
</nav>

<section>
    <div id="section_wrap">
        <div class="word">
            GOALS
        </div>

        <div class="content">

            <!-- 처리 결과·오류 안내 -->
            <p id="message" class="message" role="status"></p>

            <!-- 탭: 처음에는 오늘이 보인다 -->
            <div class="tabs" role="tablist">
                <button type="button" id="tab_btn_today" class="tab selected" role="tab" aria-selected="true" data-tab="today">오늘</button>
                <button type="button" id="tab_btn_goals" class="tab" role="tab" aria-selected="false" data-tab="goals">목표</button>
            </div>

            <!-- 오늘 탭: 오늘 할 활동, 놓친 활동, 다음 예정 -->
            <div id="tab_today" class="tab_panel">
                <p id="today_date" class="today_date"></p>

                <!-- 주말 회고: 끝난 주의 결과를 보고 다음 주 계획을 만든다(회고할 주가 있을 때만 보인다) -->
                <div id="retro_wrap" hidden>
                    <h3>주간 회고</h3>
                    <div id="retro_list" class="card_list"></div>
                </div>

                <div id="missed_wrap" hidden>
                    <h3>놓친 활동</h3>
                    <p class="hint">괜찮아요. 오늘 5분만 하거나, 빈 날로 옮기거나, 이번에는 건너뛸 수 있어요.</p>
                    <div id="missed_list" class="card_list"></div>
                </div>

                <h3>오늘 할 일</h3>
                <div id="today_list" class="card_list"></div>
                <p id="next_info" class="next_info" hidden></p>
            </div>

            <div id="tab_goals" class="tab_panel" hidden>

            <!-- 진행 중인 목표 -->
            <h3>내 목표</h3>
            <div id="goal_list" class="goal_list"></div>

            <!-- 새 목표 만들기: 1) 과정 선택 2) 실행 조건 3) 첫 주 계획 확인 -->
            <h3>새 목표 만들기</h3>

            <div id="course_list" class="course_list"></div>

            <form id="condition_form" class="condition_form" hidden>
                <p id="course_goal" class="course_goal"></p>

                <label id="personal_goal_label" hidden>내 목표(한 문장)
                    <input type="text" name="personal_goal" maxlength="60" placeholder="예: 10km 완주하기">
                </label>

                <label>기간
                    <select name="months">
                        <option value="1" selected>1개월</option>
                        <option value="3">3개월</option>
                        <option value="6">6개월</option>
                        <option value="12">1년(12개월)</option>
                    </select>
                </label>

                <label>현재 수준
                    <select name="level">
                        <option value="BEGINNER" selected>처음 시작해요</option>
                        <option value="EXPERIENCED">해 본 적 있어요</option>
                    </select>
                </label>

                <label>시작일 <input type="date" name="start_date"></label>

                <fieldset>
                    <legend>가능한 요일</legend>
                    <label><input type="checkbox" name="days" value="1" checked>월</label>
                    <label><input type="checkbox" name="days" value="2" checked>화</label>
                    <label><input type="checkbox" name="days" value="3" checked>수</label>
                    <label><input type="checkbox" name="days" value="4" checked>목</label>
                    <label><input type="checkbox" name="days" value="5" checked>금</label>
                    <label><input type="checkbox" name="days" value="6">토</label>
                    <label><input type="checkbox" name="days" value="7">일</label>
                </fieldset>

                <label>주당 횟수
                    <select name="weekly_count">
                        <option value="1">1회</option>
                        <option value="2">2회</option>
                        <option value="3" selected>3회</option>
                        <option value="4">4회</option>
                        <option value="5">5회</option>
                    </select>
                </label>

                <label>1회 소요 시간(분) <input type="number" name="minutes" min="5" max="120" step="5" value="20"></label>

                <label>시작 시각 <input type="time" name="start_time" value="19:30"></label>

                <button type="submit">첫 주 계획 보기</button>
            </form>

            <!-- 첫 주 계획 확인: 날짜·시각은 바꿀 수 있고, 겹치는 일정은 표시된다 -->
            <div id="preview" class="preview" hidden>
                <h3>첫 주 계획 확인</h3>
                <div id="plan_summary" class="plan_summary"></div>
                <ul id="preview_list"></ul>
                <button type="button" id="btn_start">이 계획으로 시작</button>
            </div>

            </div>

        </div>
    </div>
</section>

<footer>
    <div id="footer_wrap">
        Copyright OFFICE Corp. ALL Rights Reserved.
    </div>
</footer>

</body>
</html>
